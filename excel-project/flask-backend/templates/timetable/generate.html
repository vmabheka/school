{% extends "base.html" %}
{% block title %}Generate Timetable{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1>Auto-Generate Timetable</h1><p>Generate a basic timetable for a class</p></div>
    <a href="{{ url_for('timetable_view') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
</div>
<form method="POST">
<div class="card">
    <div class="card-body">
        <div class="form-grid">
            <div class="form-group">
                <label>Class <span class="required">*</span></label>
                <select name="class_id" class="form-control" required>
                    <option value="">Select Class</option>
                    {% for c in classes %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Periods per Day</label>
                <input type="number" name="periods_per_day" class="form-control" value="8" min="1" max="12">
            </div>
        </div>
        <p style="font-size:13px;color:var(--text-light);margin-top:12px;">
            <i class="fas fa-info-circle"></i> This will <strong>replace</strong> the existing timetable for the selected class. You can edit individual slots afterwards.
        </p>
    </div>
</div>
<div class="mt-2 d-flex gap-1">
    <button type="submit" class="btn btn-primary"><i class="fas fa-magic"></i> Generate</button>
    <a href="{{ url_for('timetable_view') }}" class="btn btn-secondary">Cancel</a>
</div>
</form>
{% endblock %}
