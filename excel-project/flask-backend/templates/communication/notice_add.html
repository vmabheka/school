{% extends "base.html" %}
{% block title %}Post Notice{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1>Post Notice</h1></div>
    <a href="{{ url_for('communication_dashboard') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
</div>
<form method="POST">
<div class="card">
    <div class="card-body">
        <div class="form-group"><label>Title <span class="required">*</span></label><input type="text" name="title" class="form-control" required></div>
        <div class="form-group"><label>Content <span class="required">*</span></label><textarea name="content" class="form-control" rows="6" required></textarea></div>
        <div class="form-grid">
            <div class="form-group"><label>Category</label>
                <select name="category" class="form-control">
                    <option value="General">General</option><option value="Academic">Academic</option><option value="Events">Events</option><option value="Urgent">Urgent</option>
                </select>
            </div>
            <div class="form-group"><label>Target Audience</label>
                <select name="target_audience" class="form-control">
                    <option value="All">All</option><option value="Students">Students</option><option value="Staff">Staff</option><option value="Parents">Parents</option>
                </select>
            </div>
            <div class="form-group"><label>Expiry Date</label><input type="date" name="expiry_date" class="form-control"></div>
        </div>
    </div>
</div>
<div class="mt-2 d-flex gap-1">
    <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Post Notice</button>
    <a href="{{ url_for('communication_dashboard') }}" class="btn btn-secondary">Cancel</a>
</div>
</form>
{% endblock %}
