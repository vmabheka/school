{% extends "base.html" %}
{% block title %}Add Staff{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1>Add Staff Member</h1><p>Register a new staff member</p></div>
    <a href="{{ url_for('staff_list') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
</div>

<form method="POST">
<div class="grid-2">
    <div class="card">
        <div class="card-header"><h3>Personal Information</h3></div>
        <div class="card-body">
            <div class="form-group">
                <label>Employee Number</label>
                <input type="text" class="form-control" value="{{ next_employee_number }}" disabled>
                <input type="hidden" name="employee_number" value="{{ next_employee_number }}">
                <p style="font-size:11px;color:var(--text-light);margin-top:4px;">Auto-generated</p>
            </div>
            <div class="form-group">
                <label>First Name <span class="required">*</span></label>
                <input type="text" name="first_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Last Name <span class="required">*</span></label>
                <input type="text" name="last_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Other Names</label>
                <input type="text" name="other_names" class="form-control">
            </div>
            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" name="date_of_birth" class="form-control">
            </div>
            <div class="form-group">
                <label>Gender</label>
                <select name="gender" class="form-control">
                    <option value="">Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
            <div class="form-group">
                <label>National ID</label>
                <input type="text" name="national_id" class="form-control">
            </div>
        </div>
    </div>
    <div class="card">
        <div class="card-header"><h3>Employment Details</h3></div>
        <div class="card-body">
            <div class="form-group">
                <label>Qualification</label>
                <input type="text" name="qualification" class="form-control" placeholder="e.g., B.Ed, Diploma">
            </div>
            <div class="form-group">
                <label>Specialization</label>
                <input type="text" name="specialization" class="form-control">
            </div>
            <div class="form-group">
                <label>Department</label>
                <input type="text" name="department" class="form-control" placeholder="e.g., Sciences, Languages">
            </div>
            <div class="form-group">
                <label>Position</label>
                <select name="position" class="form-control">
                    <option value="Teacher">Teacher</option>
                    <option value="Head">Head</option>
                    <option value="Deputy Head">Deputy Head</option>
                    <option value="HOD">HOD</option>
                    <option value="Clerk">Clerk</option>
                    <option value="Bursar">Bursar</option>
                    <option value="Librarian">Librarian</option>
                    <option value="Driver">Driver</option>
                    <option value="Warden">Warden</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Employment Date</label>
                <input type="date" name="employment_date" class="form-control">
            </div>
            <div class="form-group">
                <label>Salary</label>
                <input type="number" name="salary" class="form-control" step="0.01">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" class="form-control">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" name="address" class="form-control">
            </div>
        </div>
    </div>
</div>
<div class="mt-2 d-flex gap-1">
    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Add Staff</button>
    <a href="{{ url_for('staff_list') }}" class="btn btn-secondary">Cancel</a>
</div>
</form>
{% endblock %}
