{% extends "base.html" %}
{% block title %}Edit Staff{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1>Edit Staff</h1><p>{{ staff.employee_number }}</p></div>
    <a href="{{ url_for('staff_view', id=staff.id) }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
</div>

<form method="POST">
<div class="grid-2">
    <div class="card">
        <div class="card-header"><h3>Personal Information</h3></div>
        <div class="card-body">
            <div class="form-group">
                <label>Employee Number</label>
                <input type="text" class="form-control" value="{{ staff.employee_number }}" disabled>
                <p style="font-size:11px;color:var(--text-light);margin-top:4px;">Auto-generated (cannot be changed)</p>
            </div>
            <div class="form-group"><label>First Name</label><input type="text" name="first_name" class="form-control" value="{{ staff.first_name }}"></div>
            <div class="form-group"><label>Last Name</label><input type="text" name="last_name" class="form-control" value="{{ staff.last_name }}"></div>
            <div class="form-group"><label>Other Names</label><input type="text" name="other_names" class="form-control" value="{{ staff.other_names or '' }}"></div>
            <div class="form-group"><label>Date of Birth</label><input type="date" name="date_of_birth" class="form-control" value="{{ staff.date_of_birth.isoformat() if staff.date_of_birth else '' }}"></div>
            <div class="form-group"><label>Gender</label>
                <select name="gender" class="form-control">
                    <option value="Male" {% if staff.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if staff.gender == 'Female' %}selected{% endif %}>Female</option>
                </select>
            </div>
            <div class="form-group"><label>National ID</label><input type="text" name="national_id" class="form-control" value="{{ staff.national_id or '' }}"></div>
        </div>
    </div>
    <div class="card">
        <div class="card-header"><h3>Employment Details</h3></div>
        <div class="card-body">
            <div class="form-group"><label>Qualification</label><input type="text" name="qualification" class="form-control" value="{{ staff.qualification or '' }}"></div>
            <div class="form-group"><label>Specialization</label><input type="text" name="specialization" class="form-control" value="{{ staff.specialization or '' }}"></div>
            <div class="form-group"><label>Department</label><input type="text" name="department" class="form-control" value="{{ staff.department or '' }}"></div>
            <div class="form-group"><label>Position</label><input type="text" name="position" class="form-control" value="{{ staff.position or '' }}"></div>
            <div class="form-group"><label>Salary</label><input type="number" name="salary" class="form-control" step="0.01" value="{{ staff.salary or '' }}"></div>
            <div class="form-group"><label>Status</label>
                <select name="status" class="form-control">
                    <option value="Active" {% if staff.status == 'Active' %}selected{% endif %}>Active</option>
                    <option value="Inactive" {% if staff.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                    <option value="On Leave" {% if staff.status == 'On Leave' %}selected{% endif %}>On Leave</option>
                </select>
            </div>
            <div class="form-group"><label>Phone</label><input type="text" name="phone" class="form-control" value="{{ staff.phone or '' }}"></div>
            <div class="form-group"><label>Email</label><input type="email" name="email" class="form-control" value="{{ staff.email or '' }}"></div>
            <div class="form-group"><label>Address</label><input type="text" name="address" class="form-control" value="{{ staff.address or '' }}"></div>
        </div>
    </div>
</div>
<div class="mt-2 d-flex gap-1">
    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update</button>
    <a href="{{ url_for('staff_view', id=staff.id) }}" class="btn btn-secondary">Cancel</a>
</div>
</form>
{% endblock %}
