{% extends "base.html" %}
{% block title %}Reports{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1>Reports & Analytics</h1><p>Generate and view school reports</p></div>
</div>

<div class="stats-grid">
    <a href="{{ url_for('report_students') }}" class="stat-card" style="text-decoration:none;color:inherit;">
        <div class="icon green"><i class="fas fa-user-graduate"></i></div>
        <div class="info"><h3>Student</h3><p>Enrollment reports</p></div>
    </a>
    <a href="{{ url_for('report_fees') }}" class="stat-card" style="text-decoration:none;color:inherit;">
        <div class="icon yellow"><i class="fas fa-dollar-sign"></i></div>
        <div class="info"><h3>Fee</h3><p>Payment reports</p></div>
    </a>
    <a href="{{ url_for('report_exam_results') }}" class="stat-card" style="text-decoration:none;color:inherit;">
        <div class="icon purple"><i class="fas fa-file-alt"></i></div>
        <div class="info"><h3>Exam</h3><p>Results reports</p></div>
    </a>
</div>
{% endblock %}
