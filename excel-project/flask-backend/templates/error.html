{% extends "base.html" %}
{% block title %}Error{% endblock %}

{% block content %}
<div style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 140px);padding:20px;">
    <div class="card" style="max-width:520px;width:100%;text-align:center;">
        <div class="card-body" style="padding:40px 32px;">
            <div style="width:80px;height:80px;background:#fee2e2;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;">
                <i class="fas fa-exclamation-triangle" style="font-size:32px;color:#b91c1c;"></i>
            </div>
            <h2 style="margin-bottom:8px;">Something went wrong</h2>
            <p style="color:var(--text-light);font-size:13px;line-height:1.7;">
                The server could not complete your request. Please go back and try again.
            </p>
            {% if message %}
            <div style="margin-top:16px;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text-light);text-align:left;word-break:break-word;">
                <strong>Details:</strong> {{ message }}
            </div>
            {% endif %}
            <div style="margin-top:24px;">
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary"><i class="fas fa-home"></i> Back to Dashboard</a>
                <button onclick="history.back()" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Go Back</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
