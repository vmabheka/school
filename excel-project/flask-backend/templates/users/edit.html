{% extends "base.html" %}
{% block title %}Edit User{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1><i class="fas fa-user-edit" style="color:var(--primary)"></i> Edit User</h1>
    <p>Update role and status for {{ user.username }}</p></div>
</div>

<div class="card" style="max-width:600px">
    <div class="card-body">
        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" value="{{ user.username }}" disabled style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg)">
            </div>

            <div class="form-group">
                <label>System Role *</label>
                <select name="role" required style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px">
                    {% for role_key, role_label in role_labels.items() %}
                    {% if role_key != 'parent' and role_key != 'student' %}
                    <option value="{{ role_key }}" {% if user.role == role_key %}selected{% endif %}>{{ role_label }}</option>
                    {% endif %}
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label style="display:flex;align-items:center;gap:8px">
                    <input type="checkbox" name="is_active" value="1" {% if user.is_active %}checked{% endif %} style="width:18px;height:18px;accent-color:var(--primary)">
                    Account Active
                </label>
            </div>

            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_password" placeholder="Leave blank to keep current" minlength="6" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px">
                <small style="color:var(--text-light)">Minimum 6 characters</small>
            </div>

            <div style="display:flex;gap:12px;margin-top:20px">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
                <a href="{{ url_for('user_management') }}" class="btn" style="background:var(--bg);border:1px solid var(--border)">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
