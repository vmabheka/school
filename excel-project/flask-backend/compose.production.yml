services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  web:
    build: .
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    command:
      - gunicorn
      - --bind=0.0.0.0:8000
      - --workers=${WEB_WORKERS:-2}
      - --threads=${WEB_THREADS:-4}
      - --timeout=${WEB_TIMEOUT:-120}
      - --access-logfile=-
      - --error-logfile=-
      - wsgi:app
    ports:
      # Intentionally localhost-only. Put Nginx/Caddy/your hosting proxy in
      # front of this port to terminate HTTPS.
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - uploads:/app/static/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks: [backend]

volumes:
  postgres_data:
  uploads:

networks:
  backend:
    driver: bridge
